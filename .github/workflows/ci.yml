name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions 頁面的 Run workflow:同一版重新部署(例如換了 Cloudflare token 之後)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 需要 npm 11:wrangler 對 @cloudflare/workers-types 有一條 ^4 的
          # optional peer dependency,而本專案用的是 v5。npm 10 會想額外裝一份
          # 4.x 來滿足它,發現 lock 裡沒有就讓 `npm ci` 失敗;npm 11 不會。
          node-version: 24
          cache: npm
      - run: npm ci
      # build = tsc -b(型別檢查)+ vite build:打包壞掉要在 PR 就看到,不是等到部署才發現
      - run: npm run build
      - run: npm test
      - run: npm run test:worker

  deploy:
    # 只有 main 會部署;PR 與其他分支跑完 check 就停。手動觸發也只在選 main 時部署
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 同時只跑一個部署:後來的排隊等,不中斷跑到一半的(migration 不該被砍在中間)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Cloudflare 憑證只給需要的步驟,npm ci 跑的第三方安裝腳本拿不到
    steps:
      - name: 確認 Cloudflare 憑證已設定
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 repository secret CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID,設定方式見 README「部署」"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 先打包:打包失敗就不碰資料庫
      - run: npm run build
      # 再套 migration,最後才換上新版:新版程式碼會用到新表新欄位,schema 必須先到位。
      # 這段時間是舊版跑在新 schema 上,所以 migration 只能做加法(見 README)。
      # CI 裡 wrangler 的「資料庫可能暫停服務,繼續?」會自動回答 yes
      - name: 套用 D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply anki-pwa --remote
      - name: 部署 Worker 與靜態檔
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 把部署結果(含網址)寫成 ND-JSON,下一步拿來做煙霧測試
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: npx wrangler deploy
      - name: 煙霧測試
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(startswith("https://"))' "$WRANGLER_OUTPUT_FILE_PATH" | head -n 1)
          if [ -z "$url" ]; then
            echo "::warning::wrangler 沒有回報 https 網址,跳過煙霧測試"
            exit 0
          fi
          scripts/smoke-test.sh "$url"
          echo "部署完成:$url" >> "$GITHUB_STEP_SUMMARY"
